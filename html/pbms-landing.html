<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBMS</title>
    <link rel="icon" type="image/svg+xml" href="https://openg2p.github.io/project/design-assets/favicon-for-white-bg.svg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100;400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            display: flex;
            align-items: flex-start;
            justify-content: center; /* Centers container horizontally */
        }
        .container {
            width: 100vw;
            #width: 1280px;
            overflow: hidden;
        }
        .header {
            position: relative;
            border-bottom: 1px solid #ddd;
            background: #ffffff;
            height: 99px; 
            display: flex;
        }
        .logo {
            width: 144px;
            height: auto;
            position: absolute;
            left: 123px;
            top: 28px;
        }
        .black-background {
            position: relative;
            background: #000000;
            height: 703px; 
            justify-content: center;
            display: flex
        }
        .black-title-image {
            position: absolute; 
            #left: 550px; 
            top: 40px;  
            width: 180px;
            height: auto;
             
        }
       .black-version {
            position: absolute; 
            top: 160px;  
            max-width: 483px;
            font-family: 'Montserrat'; 
            font-weight: 'Regular';
            font-size: 16px;
            color: #8C8989;
        }

       .link-container {
            display: flex;
            position: relative; 
            width: 1050px;
            height: 700px;
            top: 20px;
            #justify-content: center;
       }
       .link-square {
            display: flex;
            #position: relative;
            position: absolute;
            border-radius: 20px;
            background: #F4C235;
            top: 250px;
            width: 288px;
            height: 106px;
        }
       .link-text {
            position: absolute; 
            left: 28px;
            top: 31px;
            width: 200px;
            font-weight: 'Regular';
            font-size: 20px;
            font-family: 'Inter';
            color: #514C4C;
        }
       .icon {
            position: absolute; 
            left: 214px;
            top: 31px;
            width: 46px;
            height: 46px;
        }
        .hidden {
        display: none; /* Completely hides the element */
        }
    
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://openg2p.github.io/project/design-assets/OpenG2PHorizontalLogoLightBackground.png" class="logo">
        </div>

        <div class="black-background">
            <img class="black-title-image" src="https://openg2p.github.io/project/design-assets/PBMS-on-dark-background.png"></img>
            <div class="black-version">Package version: ${PBMS_VERSION}<br>App version: ${PBMS_APP_VERSION}</div>

            <div class="link-container">
	    <a href="${PBMS_ADMIN_URL}" target="_blank">
                <div class="link-square" style="left: 0px; position: absolute;">
                    <div class="icon"><img src="https://openg2p.github.io/project/design-assets/link-icon.png"></img></div>
                    <div class="link-text">PBMS Admin</div>
                </div>
            </a>

	    <a href="${PBMS_REPORTING_URL}" target="_blank">
                <div class="link-square" style="left: 385px;">
                    <div class="icon">
                        <img src="https://openg2p.github.io/project/design-assets/link-icon.png"></img>
                    </div>
                    <div class="link-text">Reporting Dashboard</div>
                </div>

	    <a href="${PBMS_BENEFICIARY_URL}" target="_blank">
                <div class="link-square" style="right: 0; position: absolute;">
                    <div class="icon">
                        <img src="https://openg2p.github.io/project/design-assets/link-icon.png"></img>
                    </div>
                    <div class="link-text">Beneficiary<br>Portal</div>
                </div>
            </a>

	    <a href="${PBMS_LOGGING_URL}" target="_blank">
                <div class="link-square" style="left: 385px; top: 400px;">
                    <div class="icon">
                        <img src="https://openg2p.github.io/project/design-assets/link-icon.png"></img>
                    </div>
                    <div class="link-text">Logging<br>Dashboard</div>
                </div>
            </a>

	    <a href="${PBMS_ODK_URL}" target="_blank">
                <div class="link-square" style="top: 400px">
                    <div class="icon">
                        <img src="https://openg2p.github.io/project/design-assets/link-icon.png"></img>
                    </div>
                    <div class="link-text">ODK<br>Admin</div>
                </div>
            </a>
	    <a href="${PBMS_SUPERSET_URL}" target="_blank">
                <div class="link-square" style="right: 0; top: 400px; position: absolute; ">
                    <div class="icon">
                        <img src="https://openg2p.github.io/project/design-assets/link-icon.png"></img>
                    </div>
                    <div class="link-text">Superset<br>Dashboard</div>
                </div>
            </a>
	    <a href="${PBMS_KAFKA_URL}" target="_blank">
                <div class="link-square" style="left: 0px; top: 550px; position: absolute;">
                    <div class="icon">
                        <img src="https://openg2p.github.io/project/design-assets/link-icon.png"></img>
                    </div>
                    <div class="link-text">Kafka<br>Admin</div>
                </div>
            </a>

	    <a href="${PBMS_MINIO_URL}" target="_blank">
                <div class="link-square" style="left: 380px; top: 550px;">
                    <div class="icon">
                        <img src="https://openg2p.github.io/project/design-assets/link-icon.png"></img>
                    </div>
                    <div class="link-text">MinIO<br>Dashboard</div>
                </div>
            </a>

	    <a href="${PBMS_SERVICE_PROVIDER_URL}" target="_blank">
                <div class="link-square" style="top: 550px; right: 0; position: absolute;">
                    <div class="icon">
                        <img src="https://openg2p.github.io/project/design-assets/link-icon.png"></img>
                    </div>
                    <div class="link-text">Service Provider<br>Portal</div>
                </div>
            </a>
            </div>

        </div>
    </div>
</body>
</html>
